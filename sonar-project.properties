# sonar-project.properties
# Config for the SonarQube/SonarCloud scan in .github/workflows/sonarqube.yml.

sonar.projectKey=omoriceau_chonkycat-fe
sonar.organization=omoriceau

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.test.ts,**/*.test.tsx,**/__tests__/**

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.amplify/**,amplify/**
sonar.coverage.exclusions=**/*.test.js,**/*.test.jsx,**/*.test.ts,**/*.test.tsx,**/__tests__/**
